plugins {
    id 'com.android.application'
}

android {
    namespace 'com.viferor.radioespana'
    compileSdk 34

    defaultConfig {
        applicationId 'com.viferor.radioespana'
        minSdk 23
        targetSdk 34
        versionCode 11900
        versionName '1.19.0'
    }

    // En GitHub Actions se firma siempre con la clave del PC (secreto DEBUG_KEYSTORE_B64, que el
    // workflow deja en RV_DEBUG_KEYSTORE). Sin esto Gradle creaba una clave nueva en cada
    // compilación y el móvil decía «conflicto» al actualizar. En el PC no cambia nada.
    signingConfigs {
        debug {
            def ks = System.getenv('RV_DEBUG_KEYSTORE')
            if (ks && new File(ks).exists()) {
                storeFile new File(ks)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    // Motor nativo de «Mi música» (NativeMusic.java): ExoPlayer, solo la parte de audio.
    // 1.4.x es la última que compila con compileSdk 34.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.annotation:annotation:1.7.1'
}
